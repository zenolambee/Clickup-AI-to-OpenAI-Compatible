[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-proxy-chat"
version = "0.1.0"
description = "OpenAI-compatible API proxies for multiple AI chat services (Notion, Qwen, Claude, Grok, Kimi, Gemini, Bolt.new)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mughu-id" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "curl_cffi>=0.7",
    "python-dotenv>=1.0",
]

[project.scripts]
notionchat = "notionchat.__main__:main"
notion = "notionchat.__main__:main"
qwenchat = "qwenchat.__main__:main"
qwen = "qwenchat.__main__:main"
claudechat = "claudechat.__main__:main"
claude = "claudechat.__main__:main"
grokchat = "grokchat.__main__:main"
grok = "grokchat.__main__:main"
kimichat = "kimichat.__main__:main"
kimi = "kimichat.__main__:main"
gemini = "gemini.__main__:main"
geminichat = "geminichat.__main__:main"
boltchat = "boltchat.__main__:main"
bolt = "boltchat.__main__:main"
higgsfieldchat = "higgsfieldchat.__main__:main"
higgsfield = "higgsfieldchat.__main__:main"
hgc = "higgsfieldchat.__main__:main"
arenachat = "arenachat.__main__:main"
arena = "arenachat.__main__:main"
pokeechat = "pokeechat.__main__:main"
pokee = "pokeechat.__main__:main"
deepseekchat = "deepseekchat.__main__:main"
deepseek = "deepseekchat.__main__:main"
deepseekweb = "deepseekweb.__main__:main"

[tool.setuptools.packages.find]
include = [
    "notionchat*",
    "qwenchat*",
    "claudechat*",
    "grokchat*",
    "kimichat*",
    "gemini*",
    "geminichat*",
    "boltchat*",
    "higgsfieldchat*",
    "arenachat*",
    "pokeechat*",
    "deepseekchat*",
    "deepseekweb*",
]
